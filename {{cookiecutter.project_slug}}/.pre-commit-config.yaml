repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --show-fixes]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pixi-install
        name: pixi-install
        entry: pixi install -e ty
        language: system
        always_run: true
        require_serial: true
        pass_filenames: false
      - id: ty
        name: ty
        entry: "pixi run -e ty ty"
        language: system
        pass_filenames: false
        require_serial: true
