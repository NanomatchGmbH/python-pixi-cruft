[project]
name = "{{ cookiecutter.project_name }}"
authors = [{name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.email }}"}]
requires-python = ">= 3.11"
dependencies = []
readme = "README.md"
license = "MIT"
version="0.1.0"
description="{{ cookiecutter.project_short_description  }}"

[project.urls]
Homepage = "{{ cookiecutter.github_url }}"

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools_scm]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.69.0"

[tool.pixi.pypi-dependencies]
# These dependencies are the main pypi dependencies for your project
# Add these also to the tool.pixi.dependencies. Keep the package itself in the first line:
{{ cookiecutter.project_slug }} = { path = ".", editable = true }
# Your dependencies come here:

# End of your dependencies
[tool.pixi.tasks]

[tool.pixi.dependencies]
# These the main conda dependencies, they will override the pypi ones
# e.g. python = "3.12.*"
# Cruft dependencies here:
# End of cruft dependencies

# Your dependencies come here:

# End of your dependencies

[tool.pixi.feature.dev.dependencies]
# Cruft dependencies here:
pixi-pycharm = "*"
# End of cruft dependencies

# Your dependencies come here:

# End of your dependencies

[tool.pixi.environments]
test = { features = ["test"], solve-group = "default" }
ty = ["ty"]
default = { features = ["dev"], solve-group = "main" }
cruft = { features = ["cruft"], no-default-feature = true }
pythonbuild = { features = ["pythonbuild"], no-default-feature = true, solve-group = "default" }
rattlerbuild = { features = ["rattlerbuild"], no-default-feature = true, solve-group = "default" }
lint = { features = ["lint"], no-default-feature = true, solve-group = "default" }

[tool.pixi.feature.lint.dependencies]
ruff = "*"
pre-commit = ">=3.7.1,<4"
pre-commit-hooks = ">=4.6.0,<5"
typos = ">=1.23.1,<2"

[tool.pixi.feature.lint.tasks]
pre-commit-install = "pre-commit install"
pre-commit-run = "pre-commit run --all"
lint = { depends-on = ["pre-commit-run"] }

[tool.pixi.feature.cruft.dependencies]
cruft = "*"

[tool.pixi.feature.cruft.tasks]
cruft = "cruft"

[tool.pixi.feature.test.dependencies]
# Cruft dependencies here:
pytest = ">=7,<8"
pytest-cov = ">=6.0.0,<7"
# Cruft dependencies end. Add yours below this line

[tool.pixi.feature.test.tasks]
tests = "python -m pytest --junitxml=pytest.xml --cov-report=term-missing:skip-covered --cov={{ cookiecutter.project_slug }}"

[tool.pixi.feature.ty.dependencies]
ty = "*"
# Add your ty dependencies here:

# End of your ty dependencies

[tool.pixi.feature.ty.tasks]
ty = "ty check ."

[tool.pixi.feature.rattlerbuild.dependencies]
rattler-build = "*"

[tool.pixi.feature.rattlerbuild.tasks]
rattlerbuild = "rattler-build build --experimental --recipe recipe/"

[tool.pixi.feature.pythonbuild.dependencies]
python-build = "*"

[tool.pixi.feature.pythonbuild.tasks]
pythonbuild = "python3 -m build"

[tool.pytest.ini_options]
pythonpath = "src"
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

