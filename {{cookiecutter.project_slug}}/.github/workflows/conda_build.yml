{% raw %}name: "Build Conda Package"
on:
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  build_conda_package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          environments: rattlerbuild
      - name: Build
        id: build
        run: |
          pixi run rattlerbuild
          OUTPUTFILE=$(find output/ -name "*.conda" | head -1)
          echo "releasepath=`realpath $OUTPUTFILE`" >> $GITHUB_OUTPUT

      - name: Archive conda package
        uses: actions/upload-artifact@v4
        with:
          name: condapackage
          path: ${{ steps.build.outputs.releasepath }}

      - name: Upload to Channel
        run: |
          pixi run rattler-build upload prefix \
            --channel {% endraw %}{{ cookiecutter.conda_channel }}{% raw %} \
            --token ${{ secrets.PREFIX_PUBLISH_KEY }} \
            ${{ steps.build.outputs.releasepath }}{% endraw %}
